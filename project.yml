# XcodeGen spec — source of truth for Dictate.xcodeproj.
# Regenerate after editing:  xcodegen generate
name: Dictate

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Signing: the only identity in this keychain is a Developer ID Application certificate.
    # A stable identity keeps macOS permission grants (Accessibility, Input Monitoring)
    # valid across rebuilds. See BUILD_PLAN.md §5, gotcha 1.
    DEVELOPMENT_TEAM: FS3T7J3D7X
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    PROVISIONING_PROFILE_SPECIFIER: ""

packages:
  DictationKit:
    path: Packages/DictationKit

targets:
  Dictate:
    type: application
    platform: macOS
    sources:
      - path: Dictate
    dependencies:
      - package: DictationKit
        product: DictationKit
    info:
      path: Dictate/Info.plist
      properties:
        CFBundleDisplayName: Dictate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        # Menu-bar-only app: no Dock icon, never steals focus on launch.
        LSUIElement: true
        NSMicrophoneUsageDescription: Dictate records your voice only while you hold the dictation key, so it can transcribe what you say.
    entitlements:
      path: Dictate/Dictate.entitlements
      properties:
        # Hardened Runtime blocks the microphone unless this is declared.
        # No App Sandbox: the event tap, Accessibility reads and synthetic Cmd+V need it off.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Dictate
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dictate
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}
